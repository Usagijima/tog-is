    - "后端：LM Studio/Bionic 替代 vLLM（Windows 原生 Python 3.14 无 vLLm 发行版）；wsl2_vllm_formal_env 作废"
    - "统计口径：种子17阶段不做跨种子结论；Holm 校正后无显著差异已如实报告（EXP-023）"
  lessons_logged:
    - "EXP-017：token预算属于单条轨迹，共享客户端会中毒；生成端每次调用新建客户端"
    - "EXP-023：所有显著性必须做多重比较校正后再下结论"
    - "EXP-025：子集枚举上限太低会系统性漏解；正式版用 MILP（scipy.optimize.milp/HiGHS）精确求解"
  pending:
    - "种子29/43批（run_seeds.bat，约60h）→ 重跑 step15_summary.py 出最终统计"
    - "压力测试128条（方案14.4）与LLM收据替换（step20留口）待服务器空档"
    - "论文英文翻译与投稿（Workshop 截止约2026-11-20）"
